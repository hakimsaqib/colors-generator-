<!DOCTYPE html>
<head>
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">


        <div class="toggle-container">
         <button id="toggle">Dark</button>
        </div>
        <h1>Color Plate Generater</h1>
        <hr class="style-line">
        <button id="generate-btn">
            Generate Plate
        </button> 

        <div class="palette-container">

        <div class="color-box">
         <div class="color"></div>
         <div class="color-info">
            <span class="hex-value">red</span>
            <button class="copy-btn" title="copy color">copy</button>
         </div>
        </div>

        <div class="color-box">
         <div class="color"></div>
         <div class="color-info">
            <span class="hex-value">green</span>
            <button class="copy-btn" title="copy color">copy</button>
         </div>
        </div>


        <div class="color-box">
         <div class="color"></div>
         <div class="color-info">
            <span class="hex-value">yellow</span>
            <button class="copy-btn" title="copy color">copy</button>
         </div>
        </div>


        <div class="color-box">
         <div class="color"></div>
         <div class="color-info">
            <span class="hex-value">blue</span>
            <button class="copy-btn" title="copy color">copy</button>
         </div>
        </div>

        <div class="color-box">
         <div class="color"></div>
         <div class="color-info">
            <span class="hex-value">cyan</span>
            <button class="copy-btn" title="copy color">copy</button>
         </div>
        </div>

        </div>
    </div>
     
    <script src="script.js"></script>
</body>
</html>
